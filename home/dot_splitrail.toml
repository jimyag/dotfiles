[server]
url = "https://splitrail.dev"
api_token = ""

[upload]
auto_upload = false
upload_today_only = false
retry_attempts = 3

[formatting]
number_comma = true
number_human = false
locale = "en"
decimal_places = 2

[logging]
level = "error"

[tui]
reverse_sort_default = true
hide_empty_periods = true

