"$schema" = 'https://starship.rs/config-schema.json'

# Preserve the original alanpeabody layout without a second prompt line.
add_newline = false
format = '$username$hostname$directory( \($git_branch$git_status\))$character'
right_format = '$status$ruby$cmd_duration'

[username]
show_always = true
style_user = 'purple'
style_root = 'bold purple'
format = '[$user]($style)'

[hostname]
ssh_only = false
style = 'purple'
format = '[@$hostname ]($style)'

[directory]
style = 'blue'
format = '[$path]($style)'
truncation_length = 0
truncate_to_repo = false

[git_branch]
style = 'green'
format = '[$branch]($style)'

[git_status]
style = 'green'
format = '([ $all_status$ahead_behind]($style))'

[ruby]
style = 'green'
format = '[‹$version› ]($style)'

[cmd_duration]
style = 'yellow'
format = '[$duration]($style)'

[status]
disabled = false
style = 'red'
format = '[$status ↵ ]($style)'

[character]
format = ' $symbol '
success_symbol = '\$'
error_symbol = '\$'
